spring:
  application:
    name: petstore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/petstore}
    username: ${DB_USERNAME:petstore_user}
    password: ${DB_PASSWORD:petstore_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:certs/public.pem}

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-random-secret-at-least-32-chars-long}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
